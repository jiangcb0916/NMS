<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#101820">
    <title>登录 - 网络管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/app.css', v=config.VERSION ~ '-base-v5') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/workspace.css', v=config.VERSION ~ '-workspace-v5-topology-flow') }}" rel="stylesheet">
</head>
<body class="login-body">
    <main class="login-frame">
        <section class="login-context" aria-label="系统说明">
            <header class="login-brand">
                <span class="login-brand-mark"><i class="bi bi-shield-check" aria-hidden="true"></i></span>
                <div>
                    <h1>网络管理系统</h1>
                    <p>统一运维平台 · {{ config.VERSION }}</p>
                </div>
            </header>
            <div class="login-context-copy">
                <span>内网运维工作台</span>
                <h2>集中查看网络状态，快速定位运行异常</h2>
                <p>统一汇总设备、链路、无线、流量与准入资产信息。</p>
            </div>
            <ul class="login-capabilities" aria-label="平台能力">
                <li><i class="bi bi-diagram-3" aria-hidden="true"></i><span>网络与链路监控</span></li>
                <li><i class="bi bi-activity" aria-hidden="true"></i><span>实时状态与异常识别</span></li>
                <li><i class="bi bi-shield-lock" aria-hidden="true"></i><span>内网访问与权限控制</span></li>
            </ul>
        </section>

        <section class="login-auth">
            <form id="login-form" class="login-form" aria-labelledby="login-title">
                <div class="login-form-heading">
                    <span class="login-form-kicker">身份验证</span>
                    <h2 id="login-title">登录运维控制台</h2>
                    <p>使用系统管理员账号继续</p>
                </div>
                <div class="login-field">
                    <label for="username">用户名</label>
                    <span class="login-input">
                        <i class="bi bi-person" aria-hidden="true"></i>
                        <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
                    </span>
                </div>
                <div class="login-field">
                    <label for="password">密码</label>
                    <span class="login-input login-password-input">
                        <i class="bi bi-lock" aria-hidden="true"></i>
                        <input id="password" name="password" type="password" autocomplete="current-password" spellcheck="false" required>
                        <button id="toggle-password" type="button" aria-label="显示密码" title="显示密码">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </span>
                </div>
                <label class="checkbox-line">
                    <input id="remember-me" name="remember_me" type="checkbox">
                    <span>保持登录</span>
                </label>
                <button type="submit" id="login-submit">
                    <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
                    <span>登录</span>
                </button>
                <div class="form-message" id="login-message" role="alert"></div>
            </form>
            <footer class="login-footer">
                <span>仅限授权用户访问</span>
                <span><i class="bi bi-lock-fill" aria-hidden="true"></i> 内网环境</span>
            </footer>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/login.js', v=config.VERSION) }}"></script>
</body>
</html>
